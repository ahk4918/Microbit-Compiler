name: Build Pipeline

on:
  push:
    branches: ["main", "master"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-win
          path: dist/*.exe

  # Linux Debian Build
  build-linux-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Build Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/bin_dist
          key: ${{ runner.os }}-build-tools-v1

      - name: Build Ninja, CMake & ARM-GCC from Source
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p buildengine/C++/toolchain/bin_dist
          
          # Build Ninja
          cd buildengine/C++/toolchain/ninja
          python3 configure.py --bootstrap
          cp ninja ../bin_dist/
          
          # Build CMake
          cd ../cmake
          ./bootstrap --parallel=$(nproc)
          make -j$(nproc)
          cp bin/cmake ../bin_dist/
          
          # Copy ARM-GCC
          cp -r $GITHUB_WORKSPACE/buildengine/C++/toolchain/arm-gcc $GITHUB_WORKSPACE/buildengine/C++/toolchain/bin_dist/
          
          # Set permissions
          chmod +x ../bin_dist/ninja ../bin_dist/cmake

      - name: Setup MicroPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv --copies
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build Debian Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:debian

      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-deb
          path: dist/*.deb

  # Release Job
  release:
    needs: [build-windows, build-linux-debian]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          token: ${{ secrets.GH_TOKEN }}