name: Build Pipeline

on:
  push:
    branches: ["main", "master"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Windows Build
  build-windows:
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ARM Toolchain
        id: cache-arm-windows
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: windows-arm-toolchain-13.2.rel1

      # Only downloads and extracts if the cache was not restored successfully
      - name: Setup ARM Toolchain
        if: steps.cache-arm-windows.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf buildengine/C++/toolchain/arm-gcc buildengine/C++/toolchain/arm-gcc-temp arm-toolchain.zip
          mkdir -p buildengine/C++/toolchain
          curl -sL -o arm-toolchain.zip "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-mingw-w64-i686-arm-none-eabi.zip" || exit 1
          7z x arm-toolchain.zip -obuildengine/C++/toolchain/arm-gcc-temp -y || exit 1
          mv buildengine/C++/toolchain/arm-gcc-temp/arm-gnu-toolchain-13.2.Rel1-mingw-w64-i686-arm-none-eabi buildengine/C++/toolchain/arm-gcc || exit 1
          rm -rf buildengine/C++/toolchain/arm-gcc-temp arm-toolchain.zip

      - name: Setup MicroPython Venv (Copy Python)
        shell: bash
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python -m venv compilerVenv --copies
          ./compilerVenv/Scripts/pip install uflash

      - name: Install & Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm install
          npm run dist:win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-win
          path: dist/*.exe
          compression-level: 9

  # macOS Universal Build
  build-mac:
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ARM Toolchain
        id: cache-arm-mac
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: mac-arm-toolchain-13.2.rel1

      # Downloads the macOS-native x86_64 toolchain (Rosetta manages execution on arm64 runners)
      - name: Setup ARM Toolchain
        if: steps.cache-arm-mac.outputs.cache-hit != 'true'
        run: |
          rm -rf buildengine/C++/toolchain/arm-gcc arm-toolchain.tar.xz
          mkdir -p buildengine/C++/toolchain/arm-gcc
          curl -sL "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz" -o arm-toolchain.tar.xz || exit 1
          tar -xf arm-toolchain.tar.xz -C buildengine/C++/toolchain/arm-gcc --strip-components=1 || exit 1
          rm arm-toolchain.tar.xz


      - name: Setup MicroPython Venv (Copy Python)
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv --copies
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build Universal Mac Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:mac

      - name: Upload Mac Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-mac
          path: dist/*.pkg
          compression-level: 9

  build-linux-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Build Tools from Source (CMake & Ninja)
        run: |
          # Build Ninja
          cd buildengine/C++/toolchain/ninja
          python3 configure.py --bootstrap
          
          # Build CMake
          cd ../cmake
          ./bootstrap --parallel=$(nproc)
          make -j$(nproc)
          
          # Move to a staging directory for packaging
          mkdir -p ../bin_dist
          cp ninja ../bin_dist/
          cp bin/cmake ../bin_dist/

      - name: Setup MicroPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv --copies
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build Debian Package
        env: { GH_TOKEN: ${{ secrets.GH_TOKEN }} }
        run: npm run dist:linux:debian
        
  # Fedora Build
  build-linux-fedora:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ARM Toolchain
        id: cache-arm-fedora
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: linux-arm-toolchain-13.2.rel1-fedora

      - name: Setup ARM Toolchain
        if: steps.cache-arm-fedora.outputs.cache-hit != 'true'
        run: |
          rm -rf buildengine/C++/toolchain/arm-gcc arm-toolchain.tar.xz
          mkdir -p buildengine/C++/toolchain/arm-gcc
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz" -O arm-toolchain.tar.xz || exit 1
          tar -xf arm-toolchain.tar.xz -C buildengine/C++/toolchain/arm-gcc --strip-components=1 || exit 1
          rm arm-toolchain.tar.xz

      - name: Setup MicroPython Venv (Copy Python)
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv --copies
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build Fedora Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:fedora

      - name: Upload Fedora Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-rpm
          path: dist/*.rpm
          compression-level: 9

  # Generic Linux TAR Build
  build-linux-tar:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ARM Toolchain
        id: cache-arm-tar
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: linux-arm-toolchain-13.2.rel1-tar

      - name: Setup ARM Toolchain
        if: steps.cache-arm-tar.outputs.cache-hit != 'true'
        run: |
          rm -rf buildengine/C++/toolchain/arm-gcc arm-toolchain.tar.xz
          mkdir -p buildengine/C++/toolchain/arm-gcc
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz" -O arm-toolchain.tar.xz || exit 1
          tar -xf arm-toolchain.tar.xz -C buildengine/C++/toolchain/arm-gcc --strip-components=1 || exit 1
          rm arm-toolchain.tar.xz

      - name: Setup MicroPython Venv (Copy Python)
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv --copies
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build TAR Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:tar

      - name: Upload TAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-tar
          path: dist/*.tar.gz
          compression-level: 9

  # Release Job
  release:
    needs: [build-windows, build-mac, build-linux-debian, build-linux-fedora, build-linux-tar]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          token: ${{ secrets.GH_TOKEN }}
