name: Build Pipeline

on:
  push:
    branches: ["main", "master"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ARM Toolchain
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: windows-arm-toolchain-13.2.rel1

      - name: Setup ARM Toolchain
        shell: bash
        run: |
          mkdir -p buildengine/C++/toolchain/arm-gcc
          curl -sL -o arm-toolchain.zip "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-mingw-w64-i686-arm-none-eabi.zip" || exit 1
          7z x arm-toolchain.zip -obuildengine/C++/toolchain/arm-gcc-temp -y || exit 1
          mv buildengine/C++/toolchain/arm-gcc-temp/*/* buildengine/C++/toolchain/arm-gcc/ || exit 1
          rm -rf buildengine/C++/toolchain/arm-gcc-temp arm-toolchain.zip

      - name: Setup MicroPython Venv
        shell: bash
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python -m venv compilerVenv
          ./compilerVenv/Scripts/pip install uflash

      - name: Install & Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm install
          npm run dist:win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-win
          path: dist/*.exe
          compression-level: 9

  # Debian Build
  build-linux-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ARM Toolchain
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: linux-arm-toolchain-13.2.rel1-debian

      - name: Setup ARM Toolchain
        run: |
          mkdir -p buildengine/C++/toolchain/arm-gcc
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz" -O arm-toolchain.tar.xz || exit 1
          tar -xf arm-toolchain.tar.xz -C buildengine/C++/toolchain/arm-gcc --strip-components=1 || exit 1
          rm arm-toolchain.tar.xz

      - name: Setup MicroPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build Debian Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:debian

      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-deb
          path: dist/*.deb
          compression-level: 9

  # Fedora Build
  build-linux-fedora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ARM Toolchain
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: linux-arm-toolchain-13.2.rel1-fedora

      - name: Setup ARM Toolchain
        run: |
          mkdir -p buildengine/C++/toolchain/arm-gcc
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz" -O arm-toolchain.tar.xz || exit 1
          tar -xf arm-toolchain.tar.xz -C buildengine/C++/toolchain/arm-gcc --strip-components=1 || exit 1
          rm arm-toolchain.tar.xz

      - name: Setup MicroPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build Fedora Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:fedora

      - name: Upload Fedora Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-rpm
          path: dist/*.rpm
          compression-level: 9

  # Generic Linux TAR Build
  build-linux-tar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ARM Toolchain
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: linux-arm-toolchain-13.2.rel1-tar

      - name: Setup ARM Toolchain
        run: |
          mkdir -p buildengine/C++/toolchain/arm-gcc
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz" -O arm-toolchain.tar.xz || exit 1
          tar -xf arm-toolchain.tar.xz -C buildengine/C++/toolchain/arm-gcc --strip-components=1 || exit 1
          rm arm-toolchain.tar.xz

      - name: Setup MicroPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build TAR Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:tar

      - name: Upload TAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-tar
          path: dist/*.tar.gz
          compression-level: 9

  # Release Job (only runs on release)
  release:
    needs: [build-windows, build-linux-debian, build-linux-fedora, build-linux-tar]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List Artifacts
        run: ls -R artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          token: ${{ secrets.GH_TOKEN }}