name: Build Pipeline
on:
  push:
    branches: [ "main", "master" ]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Cache Toolchain
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: windows-arm-toolchain-13.2
      - name: Setup Arm Toolchain
        shell: bash
        run: |
          mkdir -p buildengine/C++/toolchain/arm-gcc
          curl -sL -o arm-toolchain.zip https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-mingw-w64-i686-arm-none-eabi.zip
          7z x arm-toolchain.zip -obuildengine/C++/toolchain/arm-gcc-temp
          mv buildengine/C++/toolchain/arm-gcc-temp/*/* buildengine/C++/toolchain/arm-gcc/
          rm -rf buildengine/C++/toolchain/arm-gcc-temp arm-toolchain.zip
      - name: Setup MPython Venv
        shell: bash
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python -m venv compilerVenv
          ./compilerVenv/Scripts/pip install uflash
      - name: Install & Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm install
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: installer-win, path: dist/*.exe }

  # Linux Builds (Parallel)
  build-linux-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Cache Toolchain
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: linux-arm-toolchain-13.2
      - name: Setup Arm Toolchain
        run: |
          mkdir -p buildengine/C++/toolchain/arm-gcc
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz -O arm-toolchain.tar.xz
          tar -xf arm-toolchain.tar.xz -C buildengine/C++/toolchain/arm-gcc --strip-components=1
      - name: Setup MPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv
          ./compilerVenv/bin/pip install uflash
      - run: npm install
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:debian
      - uses: actions/upload-artifact@v4
        with: { name: installer-deb, path: dist/*.deb }

  build-linux-fedora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Cache Toolchain
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: linux-arm-toolchain-13.2
      - name: Setup Arm Toolchain
        run: |
          mkdir -p buildengine/C++/toolchain/arm-gcc
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz -O arm-toolchain.tar.xz
          tar -xf arm-toolchain.tar.xz -C buildengine/C++/toolchain/arm-gcc --strip-components=1
      - name: Setup MPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv
          ./compilerVenv/bin/pip install uflash
      - run: npm install
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:fedora
      - uses: actions/upload-artifact@v4
        with: { name: installer-rpm, path: dist/*.rpm }

  build-linux-tar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Cache Toolchain
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: linux-arm-toolchain-13.2
      - name: Setup Arm Toolchain
        run: |
          mkdir -p buildengine/C++/toolchain/arm-gcc
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz -O arm-toolchain.tar.xz
          tar -xf arm-toolchain.tar.xz -C buildengine/C++/toolchain/arm-gcc --strip-components=1
      - name: Setup MPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv
          ./compilerVenv/bin/pip install uflash
      - run: npm install
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:tar
      - uses: actions/upload-artifact@v4
        with: { name: installer-tar, path: dist/*.tar.gz }

  # Release Job
  release:
    needs: [build-windows, build-linux-debian, build-linux-fedora, build-linux-tar]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*/*