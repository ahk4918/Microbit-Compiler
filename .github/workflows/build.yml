name: Build Pipeline

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Build Tools
        id: cache-win
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/bin_dist
          key: ${{ runner.os }}-build-tools-v1
      - name: Create Toolchain Directories
        shell: powershell
        run: |
          New-Item -Path "buildengine/C++/toolchain/bin_dist/arm-gcc" -ItemType Directory -Force
          New-Item -Path "buildengine/C++/toolchain/bin_dist/ninja" -ItemType Directory -Force
          New-Item -Path "buildengine/C++/toolchain/bin_dist/cmake" -ItemType Directory -Force
      - name: Build Windows Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:win
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-win
          path: dist/*.exe

  # Shared Build Template for Linux Jobs
  # We use identical caching logic for Debian, Fedora, and Tar
  build-linux-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Build Tools
        id: cache-linux
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/bin_dist
          key: ${{ runner.os }}-build-tools-v1
      - name: Build Linux Dependencies
        if: steps.cache-linux.outputs.cache-hit != 'true'
        run: |
          mkdir -p buildengine/C++/toolchain/bin_dist/arm-gcc
          # ... (add your build steps here)
      - name: Build Debian Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:debian
      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-deb
          path: dist/*.deb

  build-linux-fedora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Build Tools
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/bin_dist
          key: ${{ runner.os }}-build-tools-v1
      - name: Build RPM Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:fedora
      - name: Upload Fedora Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-rpm
          path: dist/*.rpm

  build-linux-tar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Build Tools
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/bin_dist
          key: ${{ runner.os }}-build-tools-v1
      - name: Build Tarball
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:tar
      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-tar
          path: dist/*.tar.gz

  # Release Job
  release:
    needs: [build-windows, build-linux-debian, build-linux-fedora, build-linux-tar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          token: ${{ secrets.GH_TOKEN }}
          body_path: RELEASE.md
          generate_release_notes: true