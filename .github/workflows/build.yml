name: Debian Build Pipeline

on:
  push:
    branches: ["main", "master"]

jobs:
  build-linux-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Define Cache for all custom tools
      - name: Cache Build Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/bin_dist
          key: ${{ runner.os }}-build-tools-v1

      # 2. Build only if cache-hit is false
      - name: Build Ninja, CMake & ARM-GCC from Source
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p buildengine/C++/toolchain/bin_dist
          
          # Build Ninja
          cd buildengine/C++/toolchain/ninja
          python3 configure.py --bootstrap
          cp ninja ../bin_dist/
          
          # Build CMake
          cd ../cmake
          ./bootstrap --parallel=$(nproc)
          make -j$(nproc)
          cp bin/cmake ../bin_dist/
          
          # Setup ARM-GCC (If not built from source, move existing here)
          # Assuming you have the binary folder ready
          cp -r ../arm-gcc/* ../bin_dist/arm-gcc/

      - name: Setup MicroPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv --copies
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build Debian Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:debian