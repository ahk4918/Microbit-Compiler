name: Build Pipeline
on:
  push:
    branches: [ "main", "master" ]
  release:
    types: [published]

permissions:
  contents: write

# Helper to avoid repeating code
jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Setup Python Venv
        run: |
          python -m venv compilerVenv
          ./compilerVenv/Scripts/pip install uflash
      - name: Install & Build
        run: |
          npm install
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: installer-win, path: dist/*.exe }

  # Linux Builds (Parallel Jobs)
  build-linux-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Setup Python Venv
        run: |
          python3 -m venv compilerVenv
          ./compilerVenv/bin/pip install uflash
      - run: |
          npm install
          npm run dist:linux:debian
      - uses: actions/upload-artifact@v4
        with: { name: installer-deb, path: dist/*.deb }

  build-linux-fedora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Setup Python Venv
        run: |
          python3 -m venv compilerVenv
          ./compilerVenv/bin/pip install uflash
      - run: |
          npm install
          npm run dist:linux:fedora
      - uses: actions/upload-artifact@v4
        with: { name: installer-rpm, path: dist/*.rpm }

  build-linux-tar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Setup Python Venv
        run: |
          python3 -m venv compilerVenv
          ./compilerVenv/bin/pip install uflash
      - run: |
          npm install
          npm run dist:linux:tar
      - uses: actions/upload-artifact@v4
        with: { name: installer-tar, path: dist/*.tar.gz }

  # Release Job
  release:
    needs: [build-windows, build-linux-debian, build-linux-fedora, build-linux-tar]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*/*