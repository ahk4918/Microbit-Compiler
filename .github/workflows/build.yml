name: Build Pipeline

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ARM Toolchain
        id: cache-arm-windows
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: windows-arm-toolchain-13.2.rel1

      - name: Setup ARM Toolchain
        if: steps.cache-arm-windows.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf buildengine/C++/toolchain/arm-gcc buildengine/C++/toolchain/arm-gcc-temp arm-toolchain.zip
          mkdir -p buildengine/C++/toolchain
          curl -sL -o arm-toolchain.zip "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-mingw-w64-i686-arm-none-eabi.zip" || exit 1
          7z x arm-toolchain.zip -obuildengine/C++/toolchain/arm-gcc-temp -y || exit 1
          mv buildengine/C++/toolchain/arm-gcc-temp/arm-gnu-toolchain-13.2.Rel1-mingw-w64-i686-arm-none-eabi buildengine/C++/toolchain/arm-gcc || exit 1
          rm -rf buildengine/C++/toolchain/arm-gcc-temp arm-toolchain.zip

      - name: Setup MicroPython Venv
        shell: bash
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python -m venv compilerVenv --copies
          ./compilerVenv/Scripts/pip install uflash

      - name: Install & Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm install
          npm run dist:win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-win
          path: dist/*.exe
          compression-level: 9

  # Linux Builds (Debian, Fedora, TAR)
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [debian, fedora, tar]
        include:
          - target: debian
            dist_command: npm run dist:linux:debian
            artifact_name: microbit-compiler-deb
            artifact_path: dist/*.deb
          - target: fedora
            dist_command: npm run dist:linux:fedora
            artifact_name: microbit-compiler-rpm
            artifact_path: dist/*.rpm
          - target: tar
            dist_command: npm run dist:linux:tar
            artifact_name: microbit-compiler-tar
            artifact_path: dist/*.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache ARM Toolchain
        id: cache-arm-linux
        uses: actions/cache@v4
        with:
          path: buildengine/C++/toolchain/arm-gcc
          key: linux-arm-toolchain-13.2.rel1-${{ matrix.target }}

      - name: Setup ARM Toolchain
        if: steps.cache-arm-linux.outputs.cache-hit != 'true'
        run: |
          rm -rf buildengine/C++/toolchain/arm-gcc arm-toolchain.tar.xz
          mkdir -p buildengine/C++/toolchain/arm-gcc
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz" -O arm-toolchain.tar.xz || exit 1
          tar -xf arm-toolchain.tar.xz -C buildengine/C++/toolchain/arm-gcc --strip-components=1 || exit 1
          rm arm-toolchain.tar.xz

      - name: Setup MicroPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv --copies
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ${{ matrix.dist_command }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          compression-level: 9

  # Release Job (Manual or External Trigger)
  release:
    needs: [build-windows, build-linux]
    if: false  # Disabled by default; enable via workflow_dispatch or manual trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get Release Notes
        id: release-notes
        run: |
          NOTES=$(cat RELEASE.md || echo "No release notes provided.")
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=$NOTES" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Compiler v${{ github.run_number }}
          body: ${{ steps.release-notes.outputs.notes }}
          files: artifacts/*
          token: ${{ secrets.GH_TOKEN }}