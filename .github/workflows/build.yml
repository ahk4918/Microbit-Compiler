name: Debian Build Pipeline

on:
  push:
    branches: ["main", "master"]

jobs:
  build-linux-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Ninja & CMake from Source
        run: |
          # Build Ninja
          cd buildengine/C++/toolchain/ninja
          python3 configure.py --bootstrap
          
          # Build CMake
          cd ../cmake
          ./bootstrap --parallel=$(nproc)
          make -j$(nproc)
          
          # Move to a staging directory for packaging
          mkdir -p ../bin_dist
          cp ninja ../bin_dist/
          cp bin/cmake ../bin_dist/

      - name: Setup MicroPython Venv
        run: |
          mkdir -p buildengine/MPython
          cd buildengine/MPython
          python3 -m venv compilerVenv --copies
          ./compilerVenv/bin/pip install uflash

      - name: Install Dependencies
        run: npm install

      - name: Build Debian Package
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux:debian

      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: microbit-compiler-deb
          path: dist/*.deb